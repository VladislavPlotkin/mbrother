name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Check syntax
        run: |
          python -m py_compile rc/client/*.py rc/agent/*.py rc/__main__.py
      - name: Basic import check
        run: |
          python -c "from rc.client import viewer, app; from rc.agent import server"
